name: Deploy to GitHub Pages

on:
  # Автоматически при каждом push в main и вручную: Actions → Deploy to GitHub Pages → Run workflow.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только один деплой; новый запуск ждёт текущий, а не отменяет его на середине.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # Путь, по которому сайт открывается на Pages (для проектного репозитория — /<имя-репозитория>/).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
